name: Terraform plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente HCP Terraform
        required: true
        type: choice
        options:
          - homolog
          - production

jobs:
  plan:
    name: Plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ inputs.environment == 'homolog' && vars.TF_WORKSPACE_HOMOLOG || vars.TF_WORKSPACE_PRODUCTION }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package Lambda artifact
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package spotless:check

      - name: Validate AWS Academy session
        run: ./scripts/validate-aws-session.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Validate HCP configuration
        run: |
          set -euo pipefail
          test -n "$TF_CLOUD_ORGANIZATION" || { echo "TF_CLOUD_ORGANIZATION não configurada no ambiente."; exit 1; }
          test -n "$TF_WORKSPACE" || { echo "Workspace do ambiente não configurado."; exit 1; }

      - name: Terraform init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform plan
        run: terraform plan -input=false -no-color
